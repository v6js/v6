name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.1

      - name: make test
        run: make test
        env:
          GRADLE: gradle

  test262:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install test262 runner dependencies
        run: pip install pyyaml

      - name: make release
        run: make BUILD_TYPE=release all
        env:
          GRADLE: gradle

      - name: Run test262
        run: python3 test/run_test262.py --v6-bin build/release/bin/v6 --workers 8

      - name: Commit coverage report
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test/coverage.md
          git diff --cached --quiet || git commit -m "chore: update test262 coverage report [skip ci]"
          git push
